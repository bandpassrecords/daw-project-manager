# The website (dpm.bandpassrecords.com), built from website/ with Astro and
# published by committing the built site to the gh-pages branch, which GitHub
# Pages serves as before. Every published version is a commit there, so going
# back is a revert on gh-pages.
#
# It builds on a push that changes what the site shows, and when the release
# workflow asks after publishing a release: the download links are read from
# the newest release at build time. A pull request only checks that it builds.
name: Website

on:
  push:
    branches: [ main ]
    paths:
      - 'website/**'
      - 'resources/screenshots/**'
      - 'resources/daw/logos/**'
      - 'resources/os/**'
      - 'assets/changelog/changelog.json'
      - '.github/workflows/site.yml'
  pull_request:
    paths:
      - 'website/**'
      - '.github/workflows/site.yml'
  workflow_dispatch:

permissions:
  contents: write

# Publishing runs one at a time and never cancels; pull requests each get
# their own group so they don't queue behind it.
concurrency:
  group: website-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

jobs:
  website:
    name: Build and publish the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build
        working-directory: website
        env:
          # Read the latest release without the anonymous rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm run build
          # GitHub Pages runs Jekyll unless told not to, and Jekyll drops
          # folders starting with "_" — Astro's _astro/, every script and
          # stylesheet. website/public/.nojekyll carries the marker.
          test -f dist/.nojekyll

      - name: Check out gh-pages
        if: github.event_name != 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: gh-pages
          path: gh-pages

      # The branch becomes exactly the built site: files the site no longer
      # has are removed with it.
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: |
          rsync -a --delete --exclude .git website/dist/ gh-pages/
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "The site is unchanged."
            exit 0
          fi
          git commit -m "Website from ${GITHUB_SHA::8}: $(git -C .. log -1 --format=%s)"
          git push
